decision: ''
how: >-
  공식 사이트 대조(D41)에서 나온 방침 질문. 레거시 파일은 아래 18곡(녹음 30개)에서 弦編曲·管編曲·弦管編曲(현악·관악 편곡) 담당을
  편곡자 목록에 넣었다. 공식 CD 페이지는 이들을 編曲과 따로 적고, 다른 곡의 레거시 값과 하스노소라·이키즈라이브 어댑터(D40)는
  넣지 않는다. 근거는 공식 페이지로 달았고 note에 '편곡자에 弦·管編曲(현악·관악 편곡) 담당을 포함'이라고 적어 두었다.
  (a) 이 18곡에서도 빼서 편곡자를 編曲만으로 맞춘다(권장: D40과 같고, 레거시 Arranger 칸에서 해당 이름이 빠진다), 또는
  (b) 그대로 두고, 앞으로도 弦·管編曲을 편곡자에 넣는다(새 데이터 전체를 다시 읽어야 한다). 정하면 data/를 고치고 decision: done.
