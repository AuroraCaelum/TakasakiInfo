decision: ''
how: >-
  공식 사이트 대조(D41)에서 저장된 크레딧이 공식 페이지와 다르게 나온 것. 값은 자동으로 고치지 않았다(§6.3). 항목마다
  official(공식 페이지가 적은 값)과 proposal을 보고 data/를 고친 뒤 decision: done → takasaki review apply →
  takasaki official <프로젝트> --apply(고친 값의 근거가 그 페이지로 채워진다). 그대로 둘 항목은 keep과 사유를 적는다.
  고치기 전까지 이 값들의 근거는 migration:legacy로 남는다(W18).
