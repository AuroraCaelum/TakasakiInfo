how: 'Fandom 세트리스트에서 데이터의 곡(Work)과 맞지 않은 항목. 레거시 출력 전(performed)이라 title_raw로 둔다(E9 경고). 데이터에 있어야 할 곡이면 Work를 만들거나(공연 선공개 곡은 recordings: []) 표기 차이면 Work의 external_ids.fandom에 Fandom 제목을 적은 뒤 takasaki fandom concerts --apply를 다시 실행한다. 외부 곡(커버, BGM, 게임 코너)은 그대로 둔다. 끝나면 decision: done.'
