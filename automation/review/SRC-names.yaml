how: >-
  이름의 출처를 찾는 중(D41) 저장된 표기가 출처와 다르게 나온 것. 값은 자동으로 고치지 않았다(§6.3). 항목마다 proposal을 보고
  data/를 고친 뒤(근거 note도 함께) decision: done → takasaki review apply. 그대로 둘 항목은 keep과 사유를 적는다.
  1~13번은 고치기 전까지 근거가 migration:legacy로 남는다(W18). 14·15번은 저장값을 규칙 기반 derived로 출처를 달아 두었고,
  방침(D38·D5)을 그대로 적용할지만 정하면 된다. ID는 바꾸지 않는다(§4.5).
