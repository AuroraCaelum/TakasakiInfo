    printed: ラブライブ！サンシャイン!!Aqours クラブ活動 LIVE & FAN MEETING 〜 Landing action Yeah!! 〜
    title:
      ja: ラブライブ！サンシャイン!!Aqours クラブ活動 LIVE & FAN MEETING 〜 Landing action Yeah!! 〜
      rom: Love Live! Sunshine!! Aqours Club Katsudou LIVE & FAN MEETING ~ Landing action Yeah!! ~
      ko: 러브 라이브! 선샤인!! Aqours 클럽 활동 LIVE & FAN MEETING ~ Landing action Yeah!! ~
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_fmt.php
    note: "공식 영문 없음. Fandom은 クラブ活動을 'CLUB Activities'로 번역해서 외래어 복원+헵번으로 만듦(Club Katsudou). 〜 안쪽 공백은 공식 표기대로 둠(Fandom·나무위키는 공백 없이 ~Landing action Yeah!!~) 외부 근거: rom: 규칙 엔진 ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20Aqours%20%ED%81%B4%EB%9F%BD%20%ED%99%9C%EB%8F%99%20LIVE%20%26%20FAN%20MEETING%20~Landing%20action%20Yeah!!~. 일정 조사 메모: Two legs on one Fandom page: the Japan leg (official sp_fmt.php) and 「Love Live! Sunshine!! Aqours Club Activity LIVE & FAN MEETING Trip to Asia -Landing action Yeah!!-」 (official worldwide page worldwide/fmt.php, which prints the Seoul/Shanghai/Taipei venues only in Korean/Chinese/English: KBS ARENA; 静安体育中心 体育馆 / JINGAN SPORTS CENTRE; 台北國際會議中心 (TICC); no Japanese notation found, so ja keeps the official non-Japanese form — TICC follows the Japanese notation of the 2019 ASIA TOUR page). Stops are in date order across both legs. Official show numbering ＜1回目＞/＜2回目＞ is written Noon/Evening as on Fandom. Fandom puts the noon and evening set lists of one day in a single tab (headed '''Noon:''' / '''Evening:'''), so those tabs map to both shows; the Taipei tab is ONE undivided list although the official page lists two shows (14:00 and 19:00) — mapped to both, which show it reflects is unknown. Numazu is printed 「沼津市民文化センター 大ホール」 here; the plain 「沼津市民文化センター」 used by the later Aqours pages is kept for one venue. Makuhari is printed 「幕張メッセ イベントホール」."
    used_in: [aqours/club-fan-meeting-2017]
    ref: concert:aqours/club-fan-meeting-2017
  - kind: concert
    printed: ラブライブ！サンシャイン!!Aqours クラブ活動 LIVE & FAN MEETING 2018 ユニット対抗全国ツアー
    title:
      ja: ラブライブ！サンシャイン!!Aqours クラブ活動 LIVE & FAN MEETING 2018 ユニット対抗全国ツアー
      rom: Love Live! Sunshine!! Aqours Club Katsudou LIVE & FAN MEETING 2018 Unit Taikou Zenkoku Tour
      ko: 러브 라이브! 선샤인!! Aqours 클럽 활동 LIVE & FAN MEETING 2018 유닛대항전국투어
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_fmt2018.php
    note: "공식 영문 없음. Fandom은 'Unit Battle Tour'로 번역해서 규칙으로 만듦(ユニット対抗全国ツアー → Unit Taikou Zenkoku Tour). ko: 나무위키 문서명에서 공식 제목에 없는 '~Hop! Step! Jump!~'는 뺌. 나무위키는 '유닛대항전국투어'를 붙여 씀(띄어 쓰면 '유닛 대항 전국 투어') 외부 근거: rom: 규칙 엔진 ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20Aqours%20%ED%81%B4%EB%9F%BD%20%ED%99%9C%EB%8F%99%20LIVE%20%26%20FAN%20MEETING%20~Hop!%20Step!%20Jump!~%202018%20%EC%9C%A0%EB%8B%9B%EB%8C%80%ED%95%AD%EC%A0%84%EA%B5%AD%ED%88%AC%EC%96%B4. 일정 조사 메모: Performers per stop (official): AZALEA — Nagoya, Sendai, Hiroshima; CYaRon! — Matsuyama, Kanazawa, Osaka; Guilty Kiss — Fukuoka, Chiba, Asahikawa; Numazu — CYaRon! (Day.1), AZALEA (Day.2 Noon), Guilty Kiss (Day.2 Evening); Tokyo — all three. The opening Sapporo show (ニトリ文化ホール, 2018-09-09, Guilty Kiss) was cancelled after the Hokkaido earthquake and replaced by Asahikawa. The 「最終決戦前夜祭!!」 talk event (2019-03-01, 武蔵野の森総合スポーツプラザ・メインアリーナ, a look-back talk with no live part per the official page) is not listed. Official ＜1回目＞/＜2回目＞ written Noon/Evening as on Fandom; Fandom tabs that hold a day's noon and evening lists (or one list for both, Tokyo) map to both shows. Venue printings: 日本特殊陶業市民会館フォレストホール (the existing venue entry, whose rom uses the post-2023 Niterra name; Fandom says NGK Spark Plug), 松山市民会館・大ホール, 福岡サンパレス ホテル＆ホール, 幕張イベントホール, 武蔵野の森総合スポーツプラザ・メインアリーナ."
    used_in: [aqours/club-fan-meeting-2018]
    ref: concert:aqours/club-fan-meeting-2018
