  title_note: "ja: 주최·공식 표기. rom·ko: 번역함"
  title_source: https://ja.wikipedia.org/wiki/Aqours
  note: "[2022-05-15 DAY2] 「ラブライブ！サンシャイン!!」: 小宮有紗、斉藤朱夏、小林愛香、降幡愛 (ja.wikipedia 기준). 새로 찾은 공연. 원래 2021년 예정이었다가 연기됨. Famitsu는 이 블록을 「ラブライブ！サンシャイン!!」으로 적음(세트리스트는 공식이라고 함). 니지가사키도 DAY2에 출연했으나 이 항목에서는 다루지 않음. / [2022-05-14 DAY1, 2022-05-15 DAY2] 大西亜玖璃(上原歩夢), 前田佳織里(桜坂しずく), 小泉萌香(三船栞子), 内田 秀(ミア・テイラー), 法元明菜(鐘 嵐珠), 相良茉優(中須かすみ), 久保田未夢(朝香果林), 村上奈津実(宮下 愛), 鬼頭明里(近江彼方), 指出毬亜(エマ・ヴェルデ), 田中ちえ美(天王寺璃奈). 이틀의 출연자가 다름. DAY1은 A・ZU・NA(楠木ともり 제외)와 R3BIRTH, DAY2는 DiverDiva와 QU4RTZ. 출연자와 세트리스트 항목에 공연일을 붙임. 세트리스트는 Fandom에만 있음. Liella!(5/14)와 Aqours(5/15)도 이 페스티벌에 출연했으나 이 항목에서는 다루지 않음. / [2022-05-14 DAY1] 伊達さゆり(澁谷かのん), Liyuu(唐可可), 岬なこ(嵐千砂都), ペイトン尚未(平安名すみれ), 青山なぎさ(葉月恋). 연기된 회차(원래 2021년 2월 Tokyo Dome). 스트리밍도 함. 니지가사키는 이틀 모두, Aqours는 DAY2에 출연. 근거: https://fes.bn-ent.net/outline/ (주최 측 개요, Wayback 20220226151207): バンダイナムコエンターテインメントフェスティバル 2nd, DAY1 2022年5月14日(土)/DAY2 5月15日(日) 13:30開場/15:30開演, 2(이하 잘림)에서 연기. https://fes.bn-ent.net/ (주최 측 첫 페이지 출연자, Wayback 20220514054105): 'ラブライブ！虹ヶ咲学園スクールアイドル同好会'가 5.14 SAT(artist/113)와 5.15 SUN(artist/30)에 모두 있음. https://fes.bn-ent.net/artist/113/ (DAY1 항목, Wayback 20220513230408): 大西亜玖璃（上原歩夢役）/ 前田佳織里（桜坂しずく役）/ 小泉萌香（三船栞子役）/ 内田 秀（ミア・テイラー役）/ 法元明菜（鐘 嵐珠役）. https://fes.bn-ent.net/artist/30/ (DAY2 항목, Wayback 20220617074511): 相良茉優（中須かすみ役）/ 久保田未夢（朝香果林役）/ 村上奈津実（宮下 愛役）/ 鬼頭明里（近江彼方役）/ 指出毬亜（エマ・ヴェルデ役）/ 田中ちえ美（天王寺璃奈役）. https://web.archive.org/web/20220226151207/https://fes.bn-ent.net/outline/ (주최 측 개요): DAY1 2022年5月14日(土) / DAY2 5月15日(日), 主催 バンダイナムコエンターテインメント. https://web.archive.org/web/20220514054105/https://fes.bn-ent.net/?platform=hootsuite (주최 측 첫 페이지): 회장 ZOZOマリンスタジアム(Tokyo Dome 2021-02-06/07에서 연기), 첫날 블록에 ラブライブ！スーパースター!! 있음. https://web.archive.org/web/20220226151221/https://fes.bn-ent.net/artist/142/ (주최 측 출연자 페이지): Liella! 伊達さゆり（澁谷かのん役）/ Liyuu（唐 可可役）/ 岬 なこ（嵐 千砂都役）/ ペイトン尚未（平安名すみれ役）/ 青山なぎさ（葉月 恋役）"
