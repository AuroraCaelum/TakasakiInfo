  note: "[2014-07-19 東海 Day1, 2014-07-20 東海 Day2] 7/19: μ’s（高坂穂乃果(CV.新田恵海)・星空凛(CV.飯田里穂)、西木野真姫(CV.Pile)、東條希(CV.楠田亜衣奈)、小泉花陽(CV.久保ユリカ)、矢澤にこ(CV.徳井青空)）（ラブライブ！）. 7/20: μ’s（ラブライブ！）, 멤버 개별 표기 없음. 2015년 해외 투어 'Lantis Festival 2015'(서울·상하이·타이베이)와는 다른 공연. 날마다 앙코르 'Starting STYLE!!'를 전 출연자가 부름(Fandom). 세트리스트는 외부 출처(Fandom)이고, 세트리스트의 [날짜] 접두어가 공연일을 나타냄. ja.wikipedia는 도카이 공연을 全員으로 적으나 주최 측 7/19 출연자 목록에는 6명만 있음(南條・内田・三森 없음). / [2014-07-27 関西 Day2] Printemps（高坂穂乃果(CV.新田恵海)、南ことり(CV.内田 彩)、小泉花陽(CV.久保ユリカ) from μ's（ラブライブ！））. 유닛(Printemps)만 출연. 세트리스트는 외부 출처(Fandom). / [2014-09-14 関東 Day2] μ’s（ラブライブ！）. 입력 목록의 'Shiokaze Park Sun Plaza'는 潮風公園 太陽の広場. 세트리스트는 외부 출처(Fandom). 근거: http://www.lantis.jp/15th/tic01.html (주최 측, Wayback 20140703180629): 東海 三重・ナガシマスパーランド芝生広場・野外特設ステージ, 2014年7月19日(土)・20日(日), 7/19 출연자에 μ’s 캐스트 6명, 7/20 출연자 'μ’s（ラブライブ. http://www.lantis.jp/15th/artist.html (주최 측 출연자 페이지, Wayback 20140730085350): μ's (ラブライブ！)가 東海 7/19와 7/20에 출연. http://www.lantis.jp/15th/tic02.html (주최 측, Wayback 20140517033349): 関西 大阪・万博記念公園もみじ川芝生広場・特設会場, 7月26日(土)、27日(日), 7/27 출연자에 Printemps와 캐스트. http://www.lantis.jp/15th/artist.html (주최 측 출연자 페이지): 関西 7/27에 'Printemps from μ's'. http://www.lantis.jp/15th/tic03.html (주최 측, Wayback 20140703200050): 関東 'TOKYOアニメパーク 15th Anniversary Live ランティス祭り 2014', 東京・潮風公園（太陽の広場・野外特設ステージ）, 2014年9月13-15日, 9/14 출연자"
