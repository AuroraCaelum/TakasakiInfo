  note: "[2019-06-21 DAY1 (Aqours), 2019-06-23 DAY3 (Guilty Kiss / AZALEA / CYaRon！)] 6/21: Aqours(9명, MC는 伊波杏樹). 6/23: Guilty Kiss from ラブライブ！サンシャイン!! Aqours（逢田梨香子・小林愛香・鈴木愛奈）. 6/23: AZALEA from ラブライブ！サンシャイン!! Aqours（諏訪ななか・小宮有紗・高槻かなこ）. 6/23: CYaRon！ from ラブライブ！サンシャイン!! Aqours（伊波杏樹・斉藤朱夏・降幡愛）. 주최 측 리포트의 회장 표기: 幕張メッセ 国際展示場 9～11ホール. 날마다 앙코르 Starting STYLE!!2019를 전 출연자가 부름. 니지가사키도 DAY3에 출연했으나(Fandom 기준 TOKIMEKI Runners) 이 항목에서는 다루지 않음. 세트리스트의 [날짜] 접두어가 공연일을 나타냄. / [2019-06-23 DAY-03] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 前田佳織里(桜坂しずく), 久保田未夢(朝香果林), 村上奈津実(宮下愛), 鬼頭明里(近江彼方), 楠木ともり(優木せつ菜), 指出毬亜(エマ・ヴェルデ), 田中ちえ美(天王寺璃奈). 3일간의 페스티벌(6/21-23)이고 니지가사키는 DAY-03(6/23)에만 출연. 주최 측 리포트로는 CG 애니메이션 영상과 함께 공연함. 출연자 목록은 Fandom에만 있고('9 original members'), 주최 측 페이지는 그룹 이름만 적음. 앙코르 참여는 리포트의 표현('本日の出演者が全員')으로 추정함. 근거: https://www.lantis.jp/20th/index.html (주최 측, Wayback 20190330): '20th Anniversary Live ランティス祭り2019 A・R・I・G・A・T・O ANISONG', 2019年6月21-23日 幕張メッセ. https://www.lantis.jp/20th/report/01-07.html (주최 측 DAY1 리포트 7): Aqours가 Day1 마지막 순서, SET LIST Hop? Stop? Nonstop! / Brightest Melody / 君のこころは輝いてるかい？ / Jump up HIGH!!, encore Start. https://www.lantis.jp/20th/report/03-07.html (주최 측 DAY3 리포트 7): Guilty Kiss, AZALEA, CYaRon！의 캐스트와 SET LIST. https://www.lantis.jp/20th/index.html (주최 측 Lantis 공연 페이지, Wayback 20190330055246): '20th Anniversary Live ランティス祭り2019 A・R・I・G・A・T・O ANISONG', 2019年6月21日-23日 開場11:30 開演. https://www.lantis.jp/20th/report/03-03.html (주최 측 DAY3 리포트 3, Wayback 20200812010942): ■虹ヶ咲学園スクールアイドル同好会가 데뷔곡 'TOKIMEKI Runners'를 CG 애니메이션과 함께 부름, SET LIST 1. TOKI. https://www.lantis.jp/20th/report/03-10.html (주최 측 DAY3 정리, Wayback 20191104003855): 虹ヶ咲 1. TOKIMEKI Runners를 포함한 DAY3 전체 세트리스트, <ENCORE> ■Line up 1. Starting STYLE!!2019"
