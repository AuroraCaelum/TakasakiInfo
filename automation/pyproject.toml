[project]
name = "takasaki"
version = "0.1.0"
description = "TakasakiInfo data pipeline: canonical data model, legacy migration, and legacy builder"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]
deploy = ["boto3>=1.35"]

[project.scripts]
takasaki = "takasaki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takasaki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
