    note: "공식 미게재. 위키백과 인물 정보. 동일인 확인: 위키백과 「Jump Into the New World」 문서(Liella!)의 「不可視なブルー」 연주 크레딧 'Piano : [[岸田勇気]]'가 인물 문서로 링크됨(https://ja.wikipedia.org/wiki/Jump_Into_the_New_World). 위키백과 문서에 스트링 편곡 경력(「fantastic dreamer」 ストリングスアレンジ)도 있음. 단 데이터의 곡 「365 Days」(弦編曲) 자체와 이어 주는 출처는 찾지 못해 다른 러브라이브! 곡 크레딧으로 판단함. 검토 권장"
