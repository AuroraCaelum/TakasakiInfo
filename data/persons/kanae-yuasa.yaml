    note: '소속사 프로필(アミューズクリエイティブスタジオ, 성우). 프로필 페이지에 러브라이브! 출연 기재는 없음. 동일인 근거: 일본어 위키백과 「湯浅かなえ」가 アミューズ 문서로 연결되고 그 소속 목록과 蓮ノ空 문서의 성우(시와 미온 역) 링크가 같은 이름을 가리킴. 아뮤즈의 같은 이름 성우는 1명'
