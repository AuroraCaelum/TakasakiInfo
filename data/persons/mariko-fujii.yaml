evidence:
  names.ja:
    status: official
    source: https://www.lovelive-anime.jp/yuigaoka/music/cd03.php
    checked: 2026-10-19
    note: 공식 표기는 「藤井万利子」. 띄어쓰기는 성·이름이 모두 한자면 띄우고 한쪽이 가나면 붙이는 방식으로 맞춤
  names.rom:
    status: established
    source: https://love-live.fandom.com/wiki/Composers_and_Arrangers
    checked: 2026-10-19
    note: Fandom 작곡·편곡자 목록의 표기(Dakara Bokura wa Narasunda!)
  names.ko:
    status: derived
    note: 읽기를 한국어 음역 방식(어두 격음, う 장음 생략 등)대로 옮김. 성은 藤井亮太와 같은 표기
  name_parts:
    status: derived
    note: 성과 이름을 나눈 위치가 이름 분리 도구 결과와 읽기 양쪽에서 맞음
  names.kana:
    status: official
    source: https://www2.jasrac.or.jp/eJwid/
    checked: 2026-11-11
    note: JASRAC 작품 검색(J-WID)에 등록된 읽기. 저작자 가나 완전일치 검색으로 확인함. 공식 근거로 보기로 사람이 정함(2026-11-11)
