evidence:
  names.ja:
    status: official
    source: https://www.lovelive-anime.jp/yuigaoka/music/cd30.php
    checked: 2026-10-19
    note: 공식 표기는 「住谷翔平」. 띄어쓰기는 성·이름이 모두 한자면 띄우고 한쪽이 가나면 붙이는 방식으로 맞춤
  names.rom:
    status: established
    source: https://love-live.fandom.com/wiki/Midnight_Rhapsody
    checked: 2026-10-19
    note: Fandom 문서의 표기. 장음 ou가 들어 있지만 공식·본인 표기가 없으면 Fandom 표기를 장음을 생략한 'Shohei'보다 우선함
  names.ko:
    status: established
    source: https://namu.wiki/w/ミッドナイトラプソディ
    checked: 2026-10-19
    note: 나무위키 곡 문서 크레딧 표기
  name_parts:
    status: derived
    note: 성과 이름을 나눈 위치가 이름 분리 도구 결과와 읽기 양쪽에서 맞음
  names.kana:
    status: established
    source: https://www2.jasrac.or.jp/eJwid/
    checked: 2026-11-11
    note: JASRAC 작품 검색(J-WID)에 같은 한자, 같은 읽기로 등록됨. 크레딧에 있는 곡이 검색 결과에 없어 동일인은 미확인. 로마자 표기와 읽기가 맞아 승인함(2026-11-11)
