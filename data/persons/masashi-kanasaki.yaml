    note: 공식 표기는 「金崎真士」. 띄어쓰기는 성·이름이 모두 한자면 띄우고 한쪽이 가나면 붙이는 방식으로 맞춤
  names.rom:
    status: established
    source: https://love-live.fandom.com/wiki/Composers_and_Arrangers
    checked: 2026-10-19
    note: Fandom 작곡·편곡자 목록의 표기와 같음
  names.ko:
    status: derived
    source: https://love-live.fandom.com/wiki/Composers_and_Arrangers
    checked: 2026-10-19
    note: Fandom 'Masashi Kanasaki'의 읽기를 한국어 음역 방식대로 옮김. MusicBrainz도 Masashi. 나무위키 Strawberry Trapper 문서는 '카네자키 마코토'로 읽음
  name_parts:
    status: derived
    note: 성과 이름을 나눈 위치가 이름 분리 도구 결과와 읽기 양쪽에서 맞음
  names.kana:
    status: official
    source: https://www2.jasrac.or.jp/eJwid/
    checked: 2026-11-11
    note: JASRAC 작품 검색(J-WID)의 작가명 검색에서 등록 읽기가 맞고 크레딧에 있는 곡이 나옴. 공식 근거로 봄(2026-11-11)
