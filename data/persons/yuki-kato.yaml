    note: 공식 표기는 「加藤優希」. 띄어쓰기는 성·이름이 모두 한자면 띄우고 한쪽이 가나면 붙이는 방식으로 맞춤
  names.rom:
    status: established
    source: https://love-live.fandom.com/wiki/Composers_and_Arrangers
    checked: 2026-10-19
    note: Fandom 작곡·편곡자 목록의 표기(Koisuru Sunflower)
  names.ko:
    status: established
    source: https://namu.wiki/w/恋するSunflower
    checked: 2026-10-19
    note: 나무위키 곡 문서 표기. 읽기 かとう ゆうき. 보통은 う 장음을 생략하지만 발음에 가까운 이 장음 표기를 쓰기로 사람이 정함(2026-10-19)
  name_parts:
    status: derived
    note: 성과 이름을 나눈 위치가 이름 분리 도구 결과와 읽기 양쪽에서 맞음
  names.kana:
    status: official
    source: https://www2.jasrac.or.jp/eJwid/
    checked: 2026-11-11
    note: JASRAC 작품 검색(J-WID)의 작가명 검색에서 등록 읽기가 맞고 크레딧에 있는 곡이 나옴. 공식 근거로 봄(2026-11-11)
