    note: "ja: 공식 해외 페이지의 '会場：中国広州久米空間'. 일본 회장에서 도도부현을 빼듯 앞의 中国는 뺌. 2024 공연은 공식 회장 표기 없이 bilibili 예매 페이지(久米空间LIVEHOUSE, 机场路1733号)뿐이지만 주소가 같아 같은 회장으로 봄. rom·ko: 출처가 없어 직접 만듦. 久米는 중국어 읽기(Jiumi, 주미), 空間은 번역(Space, 공간). id는 승인 뒤라 그대로 둠"
