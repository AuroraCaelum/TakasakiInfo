    note: 'ja: 공식 표기(Liella! 8th 공연 당시). rom·ko: 초안. 1973년에 지은 옛 第1展示館이 낡아 2022년에 닫고 헐었고, 근처에 새로 지은 第1展示館이 2022-10-01에 리뉴얼 개장했다(나고야시 안내 https://www.city.nagoya.jp/jigyou/sangyou/1026688/1026764/1026765/1026767.html, 사용자 확인). 개장 뒤 한동안 「新第１展示館」으로 불렸다(Liella! 4th 2023 공식 표기). 같은 건물이라 하나로 합치고, 앞으로는 「新」을 붙이지 않을 것이라 「第1展示館」을 이름으로 한다(D57)'
