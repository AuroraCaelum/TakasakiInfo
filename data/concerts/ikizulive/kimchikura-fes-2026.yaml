    checked: 2026-11-05
    note: "ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2026-08-08] 綾咲穂音(高橋ポルカ), 瀬古梨愛(調布のりこ), 天沢朱音(此花輝夜), 小戸森穂花(山田真緑), 涼ノ瀬葵音(佐々木翔音). lovehigh 공식 사이트에서도 주최 사이트에서도 확인하지 못함. 공식 뉴스는 열리지 않았고(lovelive-anime.jp 403, Wayback에 맞는 뉴스 사본 없음) 주최 사이트는 찾지 못함. 행사와 Ikizurai-Bu! 출연은 함께 출연한 아티스트의 레이블 페이지로만 확인돼 외부 출처로 분류함. 회장은 영어로만 적혀 있음('Grand Peace Palace (at Kyung Hee University)'). venue_ja 慶熙大学校 平和の殿堂은 이 이름을 옮긴 것이며 공식 출처의 표기가 아님. 출연 멤버는 Fandom에만 있음. 솔로곡 다섯 곡은 각각 출연한 멤버 다섯 명의 솔로 싱글이지만 Fandom이 가창자를 적지 않아 가창자는 비워 둠. 근거: 공식 미게재, 외부 출처만 있음. LL-Fans https://ll-fans.jp/data/event/309 로 교차 확인함"
