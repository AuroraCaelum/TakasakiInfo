evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/lovehigh/live/live_detail.php?_id=2ndLIVE
    checked: 2026-10-20
    note: "공식 해외 스트리밍 안내의 영문은 'IKIZULIVE! 2nd LIVE Dou-Da? DOING! ～Reply to L～'인데 그룹명 대신 프로젝트명을 넣은 것이라 쓰지 않음. 그룹명 rom은 그룹의 로마자 표기 Ikizurai-Bu!(Fandom과 같음). ko: 나무위키 문서명. 외부 근거: rom: 그룹명은 Fandom 표기 Ikizurai-Bu!. ko: https://namu.wiki/w/%EC%9D%B4%ED%82%A4%EC%A6%88%EB%9D%BC%EC%9D%B4%EB%B6%80!%202nd%20LIVE%20Dou-Da%3F%20DOING!%20~Reply%20to%20L~. 일정 조사 메모: 京王アリーナTOKYO는 2025-05-01부터 武蔵野の森総合スポーツプラザ의 명명권 이름. 게이오 전철이 명명권을 샀고 보도와 시설 사이트 keio-arena.tokyo로 확인됨. 그래서 이 회장은 기존 회장 musashino-no-mori-sogo-sports-plaza-main-arena(2023년 하스노소라 1st Live Tour가 씀)이고 날짜가 붙은 두 번째 이름이 필요함. 그 때문에 회장에 조사 의뢰서 스키마에 없는 \"existing\" 키를 더 둠. 공식 라이브 페이지는 「京王アリーナ TOKYO」로 띄어 적고 시설은 「京王アリーナTOKYO」로 적음. ko는 나무위키(「케이오 아레나 TOKYO」)를 따름."
