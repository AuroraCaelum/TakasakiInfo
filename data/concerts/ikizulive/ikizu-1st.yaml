evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/lovehigh/live/live_detail.php?_id=WhatismyL
    checked: 2026-10-20
    note: "그룹명 rom은 저장소 결정 Ikizuraibu!(D38. Fandom과 의뢰 문구는 'Ikizurai-Bu!'). 라틴 부분은 공식 표기 공백 그대로(Fandom '~What is my L?~', 나무위키 '～ What is my L? ～'). ko: 나무위키 문서명 외부 근거: rom: 결정 D38 (그룹명 Ikizuraibu!) ko: https://namu.wiki/w/%EC%9D%B4%ED%82%A4%EC%A6%88%EB%9D%BC%EC%9D%B4%EB%B6%80!%201st%20LIVE%20%EF%BD%9E%20What%20is%20my%20L%3F%20%EF%BD%9E. 일정 조사 메모: The official title has spaces inside the tildes and before the question mark (「～ What is my L ? ～」), and title_ja keeps them. It has no series prefix. Fandom gives one set list for both days, so it is mapped to both shows."
