    note: "ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: [2025-10-13] 天沢朱音(此花輝夜). FM FUKUOKA 라디오 프로그램 'あにぺろ'가 주최했지만 방송이 아니라 무대 콘서트. Ikizurai-Bu! 멤버는 한 명만 출연(此花輝夜 역 天沢朱音). 前田佳織里(니지가사키의 桜坂しずく)도 출연했지만 니지가사키가 아닌 본인 이름의 솔로 아티스트로 나와 세지 않음. Wayback 사본에서 이 공연을 알린 lovehigh 뉴스 페이지는 찾지 못함. FM Fukuoka 라디오 게스트 뉴스 01_5227/01_5461만 있음. 근거: https://fmfukuoka.co.jp/program/anime/blog/7538.html (FM FUKUOKA 주최 페이지 'あにぺろフェス': FM FUKUOKA開局55周年・番組5年目記念の初のフェス, 2025年10月13日(月・祝) 16:00開場/17:00開演, 会場 JR九州ホール（JR博多シティ9F）福岡市博多区博多駅中央街1-1)"
