    note: "공식 영문 없음. 103期 → 103rd/103기는 기존 데이터 관례(104th Ver./104기 Ver.). 전각 ：는 ':'로(공식 ja처럼 공백 없이, road-to-bloom과 같음) 외부 근거: rom: https://love-live.fandom.com/wiki/Hasunosora_Girls'_High_School_Idol_Club_103rd_Fes%C3%97ReC:_LIVE_~first_crossing~ ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%ED%95%98%EC%8A%A4%EB%85%B8%EC%86%8C%EB%9D%BC%20%EC%97%AC%ED%95%99%EC%9B%90%20%EC%8A%A4%EC%BF%A8%20%EC%95%84%EC%9D%B4%EB%8F%8C%20%ED%81%B4%EB%9F%BD%20103%EA%B8%B0%20Fes%C3%97ReC%EF%BC%9ALIVE%20%EF%BD%9Efirst%20crossing%EF%BD%9E. 일정 조사 메모: The official site gives the Osaka run its own page, 「…103期Fes×ReC：LIVE ～first crossing～【追加公演】」 (p=FRLa, 【追加公演】 = \"additional performance\"). Fandom keeps both runs on one page, so they are two stops of one concert here, and the label translates 【追加公演】. Day 2 of each run had shows starting at 13:00, 16:00 and 19:00 (from the official pages). This is a virtual live."
