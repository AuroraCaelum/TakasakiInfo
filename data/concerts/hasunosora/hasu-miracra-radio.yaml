    note: "rom: 공식 영문 없음. 夏の大補習まつり는 Fandom 표기. ラジオ公開録音은 Fandom이 'Radio Public Recording'으로 번역해서 헵번식 로마자로 씀(Radio Koukai Rokuon). Fandom이 넣은 ':'는 뺌. ko: 나무위키 표기 없음. 補習은 나무위키 라디오명 '미라쿠라 보충학습실 라디오'에 맞춰 '보충학습', まつり는 '축제'로 번역. 외부 근거: rom: https://love-live.fandom.com/wiki/Hasunosora_Girls'_High_School_Idol_Club:_Mira-Cra_Park!_Radio_Public_Recording_~Natsu_no_Daihoshuu_Matsuri~ ko: 번역함. 일정 조사 메모: Mira-Cra Park!의 라디오 공개 녹음으로, 라이브 순서가 있어 Fandom이 세트리스트로 실음. 프랜차이즈 자체 출연자의 행사라 남김. 페이지는 8/24를 ＜昼公演＞ 14:00, ＜夜公演＞ 17:30으로 적고, 영문은 [Day.1], [Day.2] <DAY>/<NIGHT>를 씀. 게스트: 8/23 Cerise Bouquet, 8/24 낮 공연 DOLLCHESTRA."
