    note: "ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: [2013-03-24] μ’ｓ: 新田恵海(高坂穂乃果役), 南條愛乃(絢瀬絵里役), 内田彩(南ことり役), 三森すずこ(園田海未役), 飯田里穂(星空凛役), Pile(西木野真姫役), 楠田亜衣奈(東條希役), 徳井青空(矢澤にこ役), 久保ユリカ(小泉花陽役). 공식 뉴스 제목은 『ブシロードカードゲームライブ2013』와 「ブシロードカードゲームLIVE2013」를 함께 씀. 세트리스트는 일부만 있음. Fandom 연혁은 僕らは今のなかで와 Snow halation을 '포함한' 3곡이라고만 적어 세 번째 곡은 알 수 없음. 근거: https://www.lovelive-anime.jp/otonokizaka/news8.php?offset=245 (2013/01/05『ブシロードカードゲームライブ2013』にμ’ｓの出演が決定, 2013年3月24日（日）17:00開演, グランキューブ大阪 メインホール, 出演 μ’ｓ, 출연진 9명 기재). https://www.lovelive-anime.jp/otonokizaka/news8.php?offset=225 (2013/02/15 ライブビューイング実施決定, 出演(予定) μ‘s, サイキックラバー, ミルキィホームズ 他)"
