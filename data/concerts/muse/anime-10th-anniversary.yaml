evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/otonokizaka/event/10thanniversary/
    checked: 2026-10-20
    note: "rom: 공식 페이지 해외 안내의 'Love Live! Anime 10th Anniversary Special Talk Session / Orchestra Concert'에서 공통 부분(Fandom과 같음). ko: 나무위키 표기 'TV 애니메이션 방송 10주년 기념'(나무위키는 앞에 '러브 라이브!'를 붙임) 외부 근거: rom: https://www.lovelive-anime.jp/otonokizaka/event/10thanniversary/ ko: https://namu.wiki/w/LoveLive!%20Orchestra%20Concert. 일정 조사 메모: No umbrella title is printed: the official events are 「TVアニメ放送10周年記念 LoveLive! Special Talk Session」, 「TVアニメ放送10周年記念 LoveLive! Orchestra Concert」 (and its ＜再演＞) and the kick-off 「TV アニメ放送10 周年記念 「LoveLive! Overseas Events」キックオフミーティング」; title_ja uses their common prefix (= Fandom's Nihongo). VENUE CONFLICT: Fandom puts the Kick-Off Meeting at Tokyo Garden Theater, but its official page (lovelive-overseas.bitfan.id, organizer SPACEY MUSIC ENTERTAINMENT, Project Love Live! cooperation) gives 恵比寿ザ・ガーデンホール, 2024-02-25, 1部 13:00 / 2部 17:00 (printed with Kangxi-radical 「恵⽐寿」, normalized); en_fandom left null for it. Special Talk Session labels follow the official English (DAY / NIGHT on Day.2). The Orchestra Concert revival (2025-01-04/05, same venue, official page) has no Fandom tab, so it is listed without fandom."
