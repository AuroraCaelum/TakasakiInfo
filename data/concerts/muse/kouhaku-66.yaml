    source: http://www.nhk.or.jp/kouhaku/artists/pdf/artists_151229.pdf
    checked: 2026-11-05
    note: "ja: 방송사·주최 표기. rom·ko: 번역안. 일정 조사 메모: 방송 출연. [2015-12-31] 新田恵海(高坂穂乃果), 内田彩(南ことり), 三森すずこ(園田海未), 飯田里穂(星空凛), Pile(西木野真姫), 楠田亜衣奈(東條希), 久保ユリカ(小泉花陽), 徳井青空(矢澤にこ). NHKホール에서 생방송. 特別企画「アニメ紅白」 코너에서 출연 순서 11번째(NHK PDF). 南條愛乃는 출연을 취소함(러브라이브 공식 공지). 근거: http://www.nhk.or.jp/kouhaku/artists/pdf/artists_151229.pdf (NHK 第66回紅白歌合戦 出場歌手・曲順 PDF, Wayback 20151231071851 보관본): 前半 特別企画「アニメ紅白」 11 μ's （初） それは僕たちの奇跡. https://www.lovelive-anime.jp/otonokizaka/news5.php (러브라이브 뉴스 2015/11/27 #9868, Wayback 20170907065906 보관본): 「第66回 NHK紅白歌合戦」にμ’sが紅組アーティストとして出場することが決定. https://www.lovelive-anime.jp/otonokizaka/news8.php?offset=95 (러브라이브 뉴스 2015/12/28 #10003, 저장해 둔 페이지): 「第66回紅白歌合戦」につきまして、南條愛乃を除くμ’sメンバーにて出場"
  schedule:
    status: official
    source: http://www.nhk.or.jp/kouhaku/artists/pdf/artists_151229.pdf
