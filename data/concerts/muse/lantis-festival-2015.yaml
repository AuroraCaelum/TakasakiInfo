evidence:
  title:
    status: derived
    source: https://www.lantis.jp/15th/2015/
    checked: 2026-10-20
    note: "rom·ko: 시리즈명은 정해진 표기, 나머지는 공식 라틴 표기. 일정 조사 메모: 란티스 자체 페스(공식 페이지는 lovelive-anime.jp가 아니라 lantis.jp). μ's가 나온 공연만 올림. 서울은 4/4-4/5에 열렸지만 μ's는 4/5(페스 Day 2)에만 나왔고 Pile은 인플루엔자로 빠짐. 상하이는 이틀 모두. 타이베이는 4/18-4/19에 열렸지만 μ's는 4/19(페스 Day 2)에만 나옴. 다른 공연지(Las Vegas, Hong Kong, Singapore)에는 μ's가 없음. lantis.jp의 제목 표기가 엇갈림: 뉴스 제목 「～Anisong World Tour～ Lantis Festival 2015」(이것을 씀), 헤더 「ANISONG WORLD TOUR 2015 LANTIS FESTIVAL」, 본문 『ANISONG WORLD TOUR 2015 Lantis Festival』. 회장은 「上海長寧体操中心(Shanghai International Gymnastic Center）」, 「TICC台北国際会議センター」로 인쇄됨."
