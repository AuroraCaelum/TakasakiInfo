evidence:
  title:
    status: derived
    source: https://www.lantis.jp/15th/2015/
    checked: 2026-10-20
    note: "rom·ko: 시리즈명 고정 표기 + 공식 라틴 표기. 일정 조사 메모: Lantis's own festival (official pages on lantis.jp, not lovelive-anime.jp). Only the shows with μ's are listed: Seoul ran 4/4-4/5 but μ's played only 4/5 (festival Day 2, without Pile: influenza); Shanghai both days; Taipei ran 4/18-4/19 but μ's played only 4/19 (festival Day 2). The other legs (Las Vegas, Hong Kong, Singapore) had no μ's. Title spellings vary on lantis.jp: news headline 「～Anisong World Tour～ Lantis Festival 2015」 (used), header 「ANISONG WORLD TOUR 2015 LANTIS FESTIVAL」, prose 『ANISONG WORLD TOUR 2015 Lantis Festival』. Venue printed 「上海長寧体操中心(Shanghai International Gymnastic Center）」 and 「TICC台北国際会議センター」."
