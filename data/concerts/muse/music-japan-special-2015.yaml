    note: 공식 미게재. 방송에서 부른 곡. 가창자가 적히지 않은 곡은 원곡 가창자, 데이터에 없는 곡은 other. 곡 셋을 NHK 표기대로 따로 적음. 일본어 위키백과의 메들리 표기는 따르지 않기로 사람이 정함
