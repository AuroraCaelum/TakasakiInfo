    note: "ja: 방송사·주최 표기. rom·ko: 라틴 원문. 일정 조사 메모: 방송 출연. [2015-09-28 公開収録] 新田恵海(高坂穂乃果), 内田彩(南ことり), 三森すずこ(園田海未), 飯田里穂(星空凛), Pile(西木野真姫), 楠田亜衣奈(東條希), 久保ユリカ(小泉花陽), 徳井青空(矢澤にこ). 방송 2015-10-11 23:00(NHK総合). 녹화일 2015-09-28, NHKホール, 8명 출연(南條愛乃 불참)은 일본어 위키백과에만 있음. 일본어 위키백과는 KiRa-KiRa Sensation!과 僕らは今のなかで를 메들리로 불렀다고 적고, NHK는 세 곡을 따로 적음. 근거: http://www.nhk.or.jp/mj/ (NHK MJ 첫 페이지, Wayback 20151006085734 보관본): 次回放送 MUSIC JAPAN SPECIAL 10月11日 午後11:00～ 1時間の特別版, LINE UP: それは僕たちの奇跡 / KiRa-KiRa Sensation! / 僕らは今のなかで. http://www.nhk.or.jp/mj/backnumber.html (NHK MJ バックナンバー, Wayback 20151017072736 보관본): 2015年10月11日, それは僕たちの奇跡 / KiRa-KiRa Sensation! / 僕らは今のなかで, μ's. 세트리스트는 곡 셋을 따로 적기로 사람이 정함"
