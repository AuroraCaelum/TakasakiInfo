    source: https://www.lovelive-anime.jp/yuigaoka/news/?id=8021
    checked: 2026-11-05
    note: "ja: 방송사·주최 표기. rom·ko: 번역함. 일정 조사 메모: 방송 출연. [2021-06-28 0:40 (6/27深夜)] 三森すずこ(園田海未), 飯田里穂(星空凛), 徳井青空(矢澤にこ), 伊波杏樹(高海千歌), 鈴木愛奈(小原鞠莉), 降幡愛(黒澤ルビィ), 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 久保田未夢(朝香果林), 田中ちえ美(天王寺璃奈), 前田佳織里(桜坂しずく), 村上奈津実(宮下愛), 指出毬亜(エマ・ヴェルデ), 伊達さゆり(澁谷かのん), Liyuu(唐可可), 岬なこ(嵐千砂都), ペイトン尚未(平安名すみれ), 青山なぎさ(葉月恋). 네 시리즈가 모두 나온 사전 녹화 NHK 특집. 토크 출연: μ's 三森・飯田・徳井, Aqours 伊波・鈴木・降幡, 虹ヶ咲 大西・相良・久保田・田中, Liella! 5명 전원. 방송의 곡 순서는 나오지 않아 뉴스에 적힌 순서로 적음. 未熟DREAMER의 Aqours 가창자는 이름이 없어 그룹 Aqours로 둠. 虹ヶ咲 항목은 메들리. 관객 앞 공연이 아님. 근거: https://www.lovelive-anime.jp/yuigaoka/news/?id=8021 (Liella! 공식 뉴스 2021-06-14, Wayback 20210916190408 보관본): NHK総合 6月28日(月)午前0:40 ※27日深夜, 네 그룹의 토크 출연진, 歌唱曲 Aqours「未熟DREAMER」. https://www.lovelive-anime.jp/yuigaoka/news/?id=8748 (Liella! 공식 뉴스 2021-12-17, Wayback 20220813223007 보관본): 재방송은 NHK Eテレ 17:35에 前編 12/18, 後編 12/25로 나눔"
