    note: "ja: 방송사·주최 표기. rom·ko: 번역함. 일정 조사 메모: 방송 출연. [2015-02-16] μ's. 스튜디오 공연(NHK 스튜디오, 이름은 나오지 않음). 일본어 위키백과는 生放送라고 적고, NHK 페이지에는 생방송이라는 말이 없음. 순서는 NHK 페이지대로 Snow halation을 먼저 두고 그다음에 신청곡 두 곡을 둠. 두 신청곡 사이의 순서는 적혀 있지 않음. NHK는 멤버 이름을 적지 않고, 일본어 위키백과는 9명 전원이라고 적음. 근거: http://www.nhk.or.jp/rhousoku/koremade/150216.html (NHK Rの法則 これまでのR 2015年2月16日, Wayback 20150222115103 보관본): 「♪Snow halation」をスタジオで披露！, μ’ｓ リクエスト曲披露: 僕らは今のなかで / START:DASH!! / それは僕たちの奇跡 の中から選ばれたの"
  schedule:
    status: official
