    note: "rom·ko: 시리즈명 고정 표기 + 공식 라틴 표기. 일정 조사 메모: Official stop titles: 「Guilty Kiss First LOVELIVE! ~ New Romantic Sailors ~」 and 「CYaRon！First LOVELIVE! ~ Braveheart Coaster ~」. Venues printed 「東京／武蔵野の森総合スポーツプラザ・メインアリーナ」 and 「福岡／西日本総合展示場 新館 ABC」 (halls A-C of the existing 西日本総合展示場 新館 entry). The page's AZALEA First LOVELIVE! ～Amazing Travel DNA～ (ゼビオアリーナ仙台, 2020-03-07/08, then 06-03/04) and 追加公演 ～PERFECT WORLD～ (さいたまスーパーアリーナ, 2020-05-09/10) were cancelled (COVID-19; official page and Fandom) and are left out."
