    note: 'ja: 주최·공식 표기. rom·ko: 번역함. 일정 조사 메모: 토크 무대(외부 행사). [2017-07-29 1回目 12:00, 2017-07-29 2回目 15:00, 2017-07-29 3回目 18:00, 2017-07-30 4回目 12:00] 伊波杏樹(高海千歌), 逢田梨香子(桜内梨子), 諏訪ななか(松浦果南), 小宮有紗(黒澤ダイヤ), 斉藤朱夏(渡辺曜), 小林愛香(津島善子), 高槻かなこ(国木田花丸), 鈴木愛奈(小原鞠莉), 降幡愛(黒澤ルビィ). 시가 운영하는 축제의 봉오도리 무대. 무엇을 추고 불렀는지 알 수 없어 세트리스트는 비워 둠. 2회째·3회째 시각(15:00, 18:00)은 anime.eiga 검색 스니펫에서 가져옴. 러브라이브 공식 뉴스 페이지는 가져오지 못했고 찾은 시 페이지에는 Aqours가 없음. jawiki에 따르면 2018(第71回)과 2019(第72回)는 취소됨. 근거: http://www.city.numazu.shizuoka.jp/kankou/event/hanabi/numazu/ (누마즈시 축제 페이지, Wayback 20170702064823 / 20170726020001: 第70回沼津夏まつり 平成29年7月29日・30日, Aqours 언급 없음)'
