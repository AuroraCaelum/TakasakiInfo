    note: "ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: [2019-06-21 DAY1 (Aqours), 2019-06-23 DAY3 (Guilty Kiss / AZALEA / CYaRon！)] 6/21: Aqours (9 members; MC by 伊波杏樹); 6/23: Guilty Kiss from ラブライブ！サンシャイン!! Aqours（逢田梨香子・小林愛香・鈴木愛奈）; 6/23: AZALEA from ラブライブ！サンシャイン!! Aqours（諏訪ななか・小宮有紗・高槻かなこ）; 6/23: CYaRon！ from ラブライブ！サンシャイン!! Aqours（伊波杏樹・斉藤朱夏・降幡愛）. Venue printed in organizer report: 幕張メッセ 国際展示場 9～11ホール. Encore Starting STYLE!!2019 (all artists) each day. Nijigasaki also on DAY3 (TOKIMEKI Runners per Fandom) — other agent's scope. [date] prefix in set list marks the day. / [2019-06-23 DAY-03] 大西亜玖璃(上原歩夢); 相良茉優(中須かすみ); 前田佳織里(桜坂しずく); 久保田未夢(朝香果林); 村上奈津実(宮下愛); 鬼頭明里(近江彼方); 楠木ともり(優木せつ菜); 指出毬亜(エマ・ヴェルデ); 田中ちえ美(天王寺璃奈). 3-day festival (6/21-23); Nijigasaki on DAY-03 (6/23) only. Organizer report says they performed alongside CG animation footage. Cast list from Fandom only ('9 original members'); organizer pages name only the group. Encore participation inferred from the report's wording ('本日の出演者が全員'). / 근거: https://www.lantis.jp/20th/index.html (organizer (Wayback 20190330): '20th Anniversary Live ランティス祭り2019 A・R・I・G・A・T・O ANISONG', 2019年6月21-23日 幕張メッセ); https://www.lantis.jp/20th/report/01-07.html (organizer report DAY1(7): Aqours closed Day1; SET LIST Hop? Stop? Nonstop! / Brightest Melody / 君のこころは輝いてるかい？ / Jump up HIGH!!; encore Start); https://www.lantis.jp/20th/report/03-07.html (organizer report DAY3(7): Guilty Kiss, AZALEA, CYaRon！ with cast and SET LIST); https://www.lantis.jp/20th/index.html (Organizer (Lantis) event page (Wayback 20190330055246): '20th Anniversary Live ランティス祭り2019 A・R・I・G・A・T・O ANISONG', 2019年6月21日-23日 開場11:30 開演); https://www.lantis.jp/20th/report/03-03.html (Organizer DAY3 report (3) (Wayback 20200812010942): ■虹ヶ咲学園スクールアイドル同好会 sang debut song 'TOKIMEKI Runners' with CG animation; SET LIST 1. TOKI); https://www.lantis.jp/20th/report/03-10.html (Organizer DAY3 wrap-up (Wayback 20191104003855): full DAY3 set list incl. 虹ヶ咲 1. TOKIMEKI Runners; <ENCORE> ■Line 