    note: 'ja: 방송사·주최 표기. rom·ko: 번역안. 일정 조사 메모: 방송 출연. [2017-12-22] Aqours. 사전 녹화한 스튜디오 프로그램이고 녹화일은 모름. NTV 편성표의 방송일은 12/22(금요일 심야 시간대). 일본어 위키백과는 12/23으로 적는데, 시간대가 자정을 넘기기 때문으로 보임. 곡은 외부 출처에만 있음. 공식 페이지에는 그룹만 있고 곡은 없음. Fandom은 TV 사이즈라고 적음. 근거: http://www.ntv.co.jp/buzzrhythm/ (NTV 프로그램 페이지, Wayback 20171219200813 보관본): 「#12 ラインナップ【12月22日放送】」歌ゲスト: Aqours. LL-Fans로 교차 확인해 2017 회차 날짜를 실제 날짜로 정함. 2022·2025 회차는 LL-Fans와 같음'
