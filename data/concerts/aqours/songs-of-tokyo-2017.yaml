    note: 'ja: 방송사·주최 표기. rom·ko: 라틴 원문. 일정 조사 메모: 방송 출연. [2017-11-25 公開収録] Aqours. 공개 녹화는 이틀 밤에 걸쳐 열렸고, Aqours가 나온 밤(11/25)은 NHK가 아니라 JaME 리포트와 메이지대학 모집 공지를 따름. 세트리스트 순서는 JaME·일본어 위키백과. NHK WORLD 방송 2018-01-01/02, NHK総合 편집판 2018-01-08과 01-09. 근거: https://www.nhk.or.jp/songsoftokyo/ (NHK 프로그램 페이지, Wayback 20171120090059 보관본): 출연 아티스트에 Aqours 포함, 公開収録 11月25日(土)・26日(日) NHKホール, 開演18:30, NHK WORLD TV 방송 1月1日・2日, 総合. http://www.lovelive-anime.jp/uranohoshi/news49.php (Aqours 공식 뉴스 2017/12/21「NHK「SONGS OF TOKYO」放送詳細につきまして」, Wayback 20171230105347 보관본): 総合テレビ 2018年1月8日 22:50～, 1月9日 0:15～'
