  title:
    status: derived
    source: https://ja.wikipedia.org/wiki/Aqours
    checked: 2026-11-05
    note: "공식 미게재: ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: [2022-05-15 DAY2] 「ラブライブ！サンシャイン!!」: 小宮有紗、斉藤朱夏、小林愛香、降幡愛 (per ja.wikipedia). NEW. Originally scheduled for 2021, postponed. Famitsu credits the block as 「ラブライブ！サンシャイン!!」 (set list said to be official). Nijigasaki also on DAY2 (other agent). / [2022-05-14 DAY1, 2022-05-15 DAY2] 大西亜玖璃(上原歩夢); 前田佳織里(桜坂しずく); 小泉萌香(三船栞子); 内田 秀(ミア・テイラー); 法元明菜(鐘 嵐珠); 相良茉優(中須かすみ); 久保田未夢(朝香果林); 村上奈津実(宮下 愛); 鬼頭明里(近江彼方); 指出毬亜(エマ・ヴェルデ); 田中ちえ美(天王寺璃奈). Two separate days with different cast: DAY1 = A・ZU・NA (without 楠木ともり) + R3BIRTH; DAY2 = DiverDiva + QU4RTZ. Performer and set-list entries carry a 'show' date. Set lists are Fandom-only. Liella! (5/14) and Aqours (5/15) also performed at this festival (not this row). / [2022-05-14 DAY1] 伊達さゆり(澁谷かのん); Liyuu(唐可可); 岬なこ(嵐千砂都); ペイトン尚未(平安名すみれ); 青山なぎさ(葉月恋). Postponed edition (originally Tokyo Dome, Feb 2021). Also streamed. Nijigasaki on both days, Aqours on DAY2. / 근거: https://fes.bn-ent.net/outline/ (Organizer outline (Wayback 20220226151207): バンダイナムコエンターテインメントフェスティバル 2nd, DAY1 2022年5月14日(土)/DAY2 5月15日(日) 13:30開場/15:30開演; postponed from 2); https://fes.bn-ent.net/ (Organizer top page lineup (Wayback 20220514054105): 'ラブライブ！虹ヶ咲学園スクールアイドル同好会' listed under both 5.14 SAT (artist/113) and 5.15 SUN (artist/30); https://fes.bn-ent.net/artist/113/ (DAY1 entry (Wayback 20220513230408): 大西亜玖璃（上原歩夢役）/ 前田佳織里（桜坂しずく役）/ 小泉萌香（三船栞子役）/ 内田 秀（ミア・テイラー役）/ 法元明菜（鐘 嵐珠役）); https://fes.bn-ent.net/artist/30/ (DAY2 entry (Wayback 20220617074511): 相良茉優（中須かすみ役）/ 久保田未夢（朝香果林役）/ 村上奈津実（宮下 愛役）/ 鬼頭明里（近江彼方役）/ 指出毬亜（エマ・ヴェルデ役）/ 田中ちえ美（天王寺璃奈役）); https://web.archive.org/web/20220226151207/https://fes.bn-ent.net/outline/ (Organizer outline: DAY1 2022年5月14日(土) / DAY2 5月15日(日); 主催 バンダイナムコエンターテインメント); https://web.archive.org/web/20220514054105/https://fes.bn-ent.net/?platform=hootsuite (Organizer top: venue ZOZOマリンスタジアム (postponed from Tokyo Dome 2021-02-06/07); ラブライブ！スーパースター!! listed in the first-day block); https://web.archive.org/web/20220226151221/https://fes.bn-ent.net/artist/142/ (Organizer artist page: Liella! 伊達さゆり（澁谷かのん役）/ Liyuu（唐 可可役）/ 岬 なこ（嵐 千砂都役）/ ペイトン尚未（平安名すみれ役）/ 青山なぎさ（葉月 恋役）)"
