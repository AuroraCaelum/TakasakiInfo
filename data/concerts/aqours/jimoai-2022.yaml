evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_jimoai2022.php
    checked: 2026-10-20
    note: "2022 페이지엔 영문이 없어 2023~2025 공식 영문(Numazu Jimoai Matsuri)을 따름. Fandom은 'Jimo Ai Festival'. ko: 나무위키는 地元愛まつり를 번역하지 않고 음역함(번역하면 '지역 사랑 축제') 외부 근거: rom: https://www.lovelive-anime.jp/uranohoshi/live/live_detail.php?p=jimoai2023 ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20%EB%88%84%EB%A7%88%EC%A6%88%20%EC%A7%80%EB%AA%A8%EC%95%84%EC%9D%B4%20%EB%A7%88%EC%B8%A0%EB%A6%AC(2022). 일정 조사 메모: Day.1 (2022-08-11, ＜昼公演＞/＜夜公演＞) was 「Aqours浦の星女学院RADIO!!! JMA放送局～スペシャル公開録音～」 (斉藤朱夏, 小林愛香, 降幡 愛), a radio public recording; Fandom says it had no singing portion and gives no set list, so its two shows are listed without fandom — drop them if radio-only shows are not wanted. Days 2-3 were 「Aqours クラブ活動 LIVE & FAN MEETING」. The official page (sp_jimoai2022.php) is linked from live_archive.php, not from the current live list."
