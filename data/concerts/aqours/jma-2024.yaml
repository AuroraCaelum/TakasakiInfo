    note: "rom: 공식 해외 배신 영문인데 '2'가 빠져 있어 넣음(Fandom은 'Station 2'). ko: 나무위키 문서명(러브라이브! → 러브 라이브!, ～ 앞 공백은 ja대로). 검수(2026-10-20) バブ는 아기 말 '바부'(나무위키 와이와이와이 문서의 청취자 호칭 바부리스와 같음)라 '밥'을 고침 외부 근거: rom: https://www.lovelive-anime.jp/uranohoshi/live/live_detail.php?p=jma2024 ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20Aqours%20%EC%9A%B0%EB%9D%BC%EB%85%B8%ED%98%B8%EC%8B%9C%20%EC%97%AC%ED%95%99%EC%9B%90%20RADIO!!!%20JMA%EC%B6%9C%EC%9E%A5%EB%B0%A9%EC%86%A1%EA%B5%AD2~%EB%8F%8C%EC%95%84%EC%98%A8%20%EB%B0%A5%20%EC%A1%B8%EC%97%85%EC%83%9D%EB%93%A4!%20%EB%9D%BC%EB%94%94%EC%98%A4%EC%99%80%20%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%A1%9C%20%EC%99%81%EC%9E%90%EC%A7%80%EA%BB%84~. 일정 조사 메모: Official stop names are 「… in KOB」, 「… in TYS」, 「… in NMZ」 (labels as Fandom writes them). Shows are ＜昼公演＞/＜夜公演＞ (Fandom tabs Day/Night), written Noon/Evening. The detail page's own <title> omits the ～ around the subtitle; the heading has them. Performers: わいわいわい (斉藤朱夏, 小林愛香, 降幡 愛)."
