evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_fmt2018.php
    checked: 2026-10-20
    note: "공식 영문 없음. Fandom은 'Unit Battle Tour'로 번역해서 규칙으로 만듦(ユニット対抗全国ツアー → Unit Taikou Zenkoku Tour). ko: 나무위키 문서명에서 공식 제목에 없는 '~Hop! Step! Jump!~'는 뺌. 나무위키는 '유닛대항전국투어'를 붙여 씀(띄어 쓰면 '유닛 대항 전국 투어') 외부 근거: rom: 규칙 엔진 ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20Aqours%20%ED%81%B4%EB%9F%BD%20%ED%99%9C%EB%8F%99%20LIVE%20%26%20FAN%20MEETING%20~Hop!%20Step!%20Jump!~%202018%20%EC%9C%A0%EB%8B%9B%EB%8C%80%ED%95%AD%EC%A0%84%EA%B5%AD%ED%88%AC%EC%96%B4. 일정 조사 메모: Performers per stop (official): AZALEA — Nagoya, Sendai, Hiroshima; CYaRon! — Matsuyama, Kanazawa, Osaka; Guilty Kiss — Fukuoka, Chiba, Asahikawa; Numazu — CYaRon! (Day.1), AZALEA (Day.2 Noon), Guilty Kiss (Day.2 Evening); Tokyo — all three. The opening Sapporo show (ニトリ文化ホール, 2018-09-09, Guilty Kiss) was cancelled after the Hokkaido earthquake and replaced by Asahikawa. The 「最終決戦前夜祭!!」 talk event (2019-03-01, 武蔵野の森総合スポーツプラザ・メインアリーナ, a look-back talk with no live part per the official page) is not listed. Official ＜1回目＞/＜2回目＞ written Noon/Evening as on Fandom; Fandom tabs that hold a day's noon and evening lists (or one list for both, Tokyo) map to both shows. Venue printings: 日本特殊陶業市民会館フォレストホール (the existing venue entry, whose rom uses the post-2023 Niterra name; Fandom says NGK Spark Plug), 松山市民会館・大ホール, 福岡サンパレス ホテル＆ホール, 幕張イベントホール, 武蔵野の森総合スポーツプラザ・メインアリーナ. ko: 검수(2026-10-20) 나무위키 문서명의 띄어쓰기를 고침."
