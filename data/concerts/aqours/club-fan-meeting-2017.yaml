evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_fmt.php
    checked: 2026-10-20
    note: "공식 영문 없음. Fandom은 クラブ活動을 'CLUB Activities'로 번역해서, 외래어는 원어로 되살리고 나머지는 헵번식으로 만듦(Club Katsudou). 〜 안쪽 공백은 공식 표기대로 둠(Fandom·나무위키는 공백 없이 ~Landing action Yeah!!~). 외부 근거: rom: 출처 없이 로마자 규칙으로 만듦. ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20Aqours%20%ED%81%B4%EB%9F%BD%20%ED%99%9C%EB%8F%99%20LIVE%20%26%20FAN%20MEETING%20~Landing%20action%20Yeah!!~. 일정 조사 메모: Fandom 한 문서에 두 구간이 있음. 일본 구간(공식 sp_fmt.php)과 「Love Live! Sunshine!! Aqours Club Activity LIVE & FAN MEETING Trip to Asia -Landing action Yeah!!-」(공식 월드와이드 페이지 worldwide/fmt.php). 후자는 서울·상하이·타이베이 회장을 한국어·중국어·영어로만 적음: KBS ARENA, 静安体育中心 体育馆 / JINGAN SPORTS CENTRE, 台北國際會議中心 (TICC). 일본어 표기를 찾지 못해 ja는 공식의 비일본어 표기를 그대로 둠. TICC는 2019 ASIA TOUR 페이지의 일본어 표기를 따름. 공연지는 두 구간을 합쳐 날짜순. 공식 회차 표기 ＜1回目＞/＜2回目＞는 Fandom처럼 Noon/Evening으로 씀. Fandom은 하루의 낮·저녁 세트리스트를 탭 하나('''Noon:''' / '''Evening:''' 머리말)에 넣어 그런 탭은 두 공연 모두에 연결함. 타이베이 탭은 공식 페이지에 공연이 둘(14:00, 19:00)인데도 나뉘지 않은 목록 하나라 두 공연 모두에 연결했고, 어느 공연을 반영한 것인지는 모름. 누마즈는 여기서 「沼津市民文化センター 大ホール」로 인쇄됨. 이후 Aqours 페이지가 쓰는 「沼津市民文化センター」를 회장 하나의 이름으로 둠. 마쿠하리는 「幕張メッセ イベントホール」로 인쇄됨."
