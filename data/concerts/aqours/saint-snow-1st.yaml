    note: "rom·ko: 시리즈명 고정 표기 + 공식 라틴 표기. 일정 조사 메모: Official shows: Yokohama Day.1 one show, Day.2 two shows (＜1回目＞13:00, ＜2回目＞18:00); Sapporo Day.1 two shows, Day.2 one show. Fandom's Makomanai Day 1 tab holds both lists (Noon/Evening); its Pia Arena MM Day 2 tab is ONE undivided list although there were two shows — mapped to both, which show it reflects is unknown. The Sapporo venue is the naming-rights name printed in 2020 (真駒内セキスイハイムアイスアリーナ; Fandom: Makomanai Ice Arena). Fandom's title_ja lacks the closing ～."
