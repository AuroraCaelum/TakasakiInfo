evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/uranohoshi/sp_saintsnow1st.php
    checked: 2026-10-20
    note: 'rom·ko: 시리즈명은 정해진 표기, 나머지는 공식 라틴 표기. 일정 조사 메모: 공식 공연 구성: 요코하마 Day.1 1회, Day.2 2회(＜1回目＞13:00, ＜2回目＞18:00). 삿포로 Day.1 2회, Day.2 1회. Fandom의 Makomanai Day 1 탭은 두 목록(Noon/Evening)을 모두 담음. Pia Arena MM Day 2 탭은 공연이 두 번이었는데도 나뉘지 않은 목록 하나라 두 공연 모두에 연결했고, 어느 공연을 반영한 것인지는 모름. 삿포로 회장은 2020년에 인쇄된 명명권 이름(真駒内セキスイハイムアイスアリーナ, Fandom: Makomanai Ice Arena). Fandom의 ja 제목에는 닫는 ～가 없음.'
