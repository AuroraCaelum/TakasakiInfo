    note: "공식 영문 못 찾음. 大革命은 Fandom 표기(Dai Kakumei, 규칙대로면 Daikakumei). 전각 'CYaRon！2nd'는 반각으로 바꾸며 띄움 외부 근거: rom: https://love-live.fandom.com/wiki/CYaRon!_2nd_LoveLive!_~Dai_Kakumei%E2%98%86Wake_Up_Kingdom~ ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%84%A0%EC%83%A4%EC%9D%B8!!%20CYaRon!%202nd%20LoveLive!%20~%EB%8C%80%ED%98%81%EB%AA%85%E2%98%86Wake%20Up%20Kingdom~. 일정 조사 메모: Official page prints the title with a full-width ！ and no space (CYaRon！2nd) and the venue as 「幕張メッセ 国際展示場」 without hall numbers; Fandom says International Exhibition Hall 1-3 (not confirmed officially)."
