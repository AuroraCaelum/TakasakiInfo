    source: https://anisama.tv/2019/setlist/
    checked: 2026-11-05
    note: "ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2019-08-31 DAY2] Aqours. 주최 페이지 제목은 'Animelo Summer Live 2019 STORY'. 니지가사키는 9/1에 출연했으며(TOKIMEKI Runners) 별도 항목에서 다룸. [2019-09-01 Day 3] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 前田佳織里(桜坂しずく), 久保田未夢(朝香果林), 村上奈津実(宮下愛), 鬼頭明里(近江彼方), 楠木ともり(優木せつ菜), 指出毬亜(エマ・ヴェルデ), 田中ちえ美(天王寺璃奈). 공식 페이지 제목 표기는 'Animelo Summer Live 2019 -STORY-'이고 Fandom 행은 'Animelo Summer Live 2019 STORY'. 페스티벌은 8/30-9/1, 니지가사키는 9/1에만 출연. 출연 멤버는 Fandom('the 9 original members')에서 가져왔고 공식 아티스트 페이지는 그룹 이름만 적음. 남아 있는 공식 페이지에 회장이 없어 Saitama Super Arena는 Fandom과 보도를 따름. 그룹이 전 출연자 피날레 CROSSING STORIES에 참여했는지는 공식 크레딧 'アニサマ2019出演アーティスト'(Day 3)로만 짐작함. 근거: https://anisama.tv/2019/setlist/ (주최 세트리스트, 8月31日（土） 블록: 43-46번이 Aqours, 메타: 8/30-9/1 さいたまスーパーアリーナ). https://anisama.tv/2019/artist/ (공식 아티스트 페이지가 day03 아티스트에 虹ヶ咲学園スクールアイドル同好会를 넣음, 이미지 day03_detail_nijigasaki.png). https://anisama.tv/2019/setlist/ (공식 세트리스트 9月1日（日）: #04 TOKIMEKI Runners / 虹ヶ咲学園スクールアイドル同好会, #45 CROSSING STORIES / アニサマ2019出演アーティスト)"
