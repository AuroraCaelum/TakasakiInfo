    checked: 2026-11-05
    note: 'ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2023-08-25 DAY1] Liella!. 회장은 アニサマ의 고정 회장인 さいたまスーパーアリーナ로 봄. 2023 세트리스트 페이지 자체에는 없음. 출연 멤버는 주최 페이지에 없음. 니지가사키는 8/27에 출연함(별도 항목). [2023-08-27 Day 3] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 法元明菜(鐘嵐珠), 田中ちえ美(天王寺璃奈), 鬼頭明里(近江彼方), 指出毬亜(エマ・ヴェルデ). 세트리스트가 엇갈림. 공식 세트리스트는 わちゅごなどぅー와 Just Believe!!!, Fandom은 Wachu Gonna Do와 TOKIMEKI Runners이며 여기서는 공식을 씀. Fandom 행에는 날짜가 없었고 공식 세트리스트로 8/27(Day 3)을 확인함. 출연 멤버는 Fandom에만 있음(2023 공식 아티스트 페이지는 지금 2026으로 넘어감). 회장은 Fandom을 따르며 남아 있는 공식 세트리스트 페이지에는 없음. 근거: https://anisama.tv/2023/setlist/ (주최 세트리스트, 8/25(金) 블록: 15 Second Sparkle / Liella!, 16 ビタミンSUMMER！ / Liella!). https://anisama.tv/2023/setlist/ (공식 세트리스트 8/27(日): #23 わちゅごなどぅー, #24 Just Believe!!! / 虹ヶ咲学園スクールアイドル同好会, #49 heartbeat-axelator / アニサマ2023出演アーティスト DAY3). LL-Fans https://ll-fans.jp/data/event/158 도 공식과 같음'
