  title:
    status: derived
    source: https://live.bushiroad-music.com/brfes2023/
    checked: 2026-11-05
    note: "ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2023-05-27] 林鼓子(優木せつ菜), 相良茉優(中須かすみ), 田中ちえ美(天王寺璃奈). 세트리스트는 Fandom에만 있음. 오프닝 콜라보 繚乱！ビクトリーロード에는 Fandom이 다른 부시로드 밴드의 성우를 적음. 이름은 Fandom의 로마자 표기 그대로 둠. Fandom 트리비아에 따르면 小泉萌香는 니지가사키가 아니라 Peaky P-key로 이 페스티벌에 나옴. Liella!(Liyuu 제외)도 이 페스티벌에 출연함(이 행이 아님). 도시는 회장(Fuji-Q Highland, Fujiyoshida) 소재지이며 주최 페이지에는 없음. [2023-05-27] Liella!. Fandom 목록의 'MIRACLE NEW STORY'는 'Nijigasaki Segment' 아래에 있어 여기서는 뺌. 니지가사키 대표로 相良茉優/林鼓子/田中ちえ美도 출연함. Liyuu(唐可可)는 출연하지 않음(공식 뉴스). 회장은 Fujiyoshida, Yamanashi에 있음. 근거: https://live.bushiroad-music.com/brfes2023/ (주최 페이지, Wayback 20230529231526 사본: BUSHIROAD ROCK FESTIVAL 2023, ブシロードミュージック主催, 2023年5月27日(土) 開場13:30/開演15:00, 会場 富士急ハイランド・コニファーフォレスト). https://www.lovelive-anime.jp/yuigaoka/topics/detail.php?p=01_2089 (Liella! 공식 뉴스 2023-05-26, Wayback 20230924062753 경유: BUSHIROAD ROCK FESTIVAL 2023, 2023年5月27日(土), 富士急ハイランド・コニファーフォレスト, Liyuu 唐可可…)"
