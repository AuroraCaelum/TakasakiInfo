    checked: 2026-11-05
    note: 'ja: 주최·공식 표기. rom·ko: 번역함. 일정 조사 메모: [2026-07-19 DAY.2] 綾咲穂音(高橋ポルカ), 遠藤璃菜(麻布麻衣), 宮野 芹(五桐 玲), 藤野こころ(駒形花火), 相良茉優(中須かすみ), 村上奈津実(宮下 愛), 田中ちえ美(天王寺璃奈). 53번 행(Ikizurai-Bu! 쪽)과 같은 공연, 같은 블록이라 니지가사키와 Ikizurai-Bu!의 합동 출연으로 한 번만 넣음. 이틀짜리 행사이며 7/18 Day1에는 러브라이브! 출연이 없어 DAY.2만 셈. 세트리스트는 Fandom에서 가져왔고 가창자는 적혀 있지 않음. 블록 순서는 1곡 뒤 Ikizurai-Bu! MC, 4곡 뒤 니지가사키 MC이고 Ai♡Scream!은 두 그룹이 함께 부름. 곡을 블록에 나눈 것은 Fandom의 MC 표시로 추정했고 곡마다 적혀 있지는 않음. 근거: https://www.lantis.jp/dayz/ (주최 Lantis 행사 페이지: 7/19(日)Day2 開場16:00 開演17:00, 출연에 『イキヅライブ！ LOVELIVE! BLUEBIRD』いきづらい部！ 綾咲穂音（高橋ポルカ役）、遠藤璃菜（麻布麻衣役）、宮野 芹（…). https://shibuyalovez.jp/schedule/?year=2026&month=7 (회장 일정: 7.19 Sun Shibuya LOVEZ OPENING SERIES「Lantis DAYZ」 OPEN16:00 START17:00)'
  schedule:
    status: official
