    checked: 2026-11-05
    note: "ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2022-07-02 DAY1] DiverDiva. 공식 출처를 확인하지 못함. 주최 사이트 xrlive-xrartists.superfes.jp는 더 이상 열리지 않고, 확인할 때 Wayback Machine이 멈춰 있었으며, lovelive-anime.jp 뉴스는 403을 돌려줌. 온라인 전용 xR(가상) 페스티벌이며 DiverDiva의 무대는 '特別事前収録'(특별 사전 녹화)로 표시돼 있어 라이브로 공연한 것이 아니라 송출한 것임. 송출형 음악 페스티벌의 일부라는 이유만으로 live_event로 분류함. doubtful 참고. 출연진이 직접 공연했는지 3DCG 캐릭터였는지는 읽은 출처에 없음. Liella!도 출연함(DAY1·DAY2, 역시 사전 녹화)이나 이 행이 아님. [2022-07-02 DAY1, 2022-07-03 DAY2] Liella!. 온라인 전용 xR 페스티벌이며 Liella!의 코너는 특별 사전 녹화. 세트리스트의 날짜 구분은 Fandom 탭을 따름. 주최 사이트는 사라졌고 아카이브도 없음. 근거: 공식 미게재, 외부 출처만 있음. LL-Fans https://ll-fans.jp/data/event/136 로 교차 확인함"
