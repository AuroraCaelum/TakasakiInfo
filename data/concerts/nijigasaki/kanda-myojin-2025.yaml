    note: 'ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: 토크 무대(외부 행사). [2025-08-08] 久保田未夢(朝香果林), 林鼓子(優木せつ菜). 토크 무대라기보다는 신사 축제의 アニソン盆踊り에 두 캐스트가 19:00쯤 참여해 관객과 함께 神田明神音頭를 춘 것(니지가사키 곡은 목록에 없음). 프로젝트 이름으로 안내된 지역 축제 출연이라 넣음. 춤만 춘 출연을 범위 밖으로 보면 뺄 것. 콜라보 특설 사이트(crux.jp)는 403. 예정대로 열렸는지는 행사 뒤 출처로 확인하지 못함. 근거: https://www.lovelive-anime.jp/nijigasaki/detail.php?p=01_5002 (러브 라이브! 뉴스, Wayback 20250716132818, 2025/07/14: 「神田明神納涼祭り」内の連携イベント, ■ アニソン盆踊りコラボ “神田明神音頭”をみんなで踊ろう！ 2025年8月8日（金）19:00頃より出演予定, 参加キャスト 久保田未夢（朝香果林). 열린 것은 사람이 확인함'
