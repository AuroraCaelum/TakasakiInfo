    note: "공식 미게재. ja: 주최·공식 표기. rom·ko: 라틴 원문. 일정 조사 메모: [2026-03-07] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 久保田未夢(朝香果林), 田中ちえ美(天王寺璃奈). 공식 전체 제목은 'ANIMAX MUSIX 2026 OSAKA supported by Lemino'. 출연진 목록은 Fandom에만 있고 주최 측은 그룹 이름만 적음. 大西亜玖璃는 같은 공연에서 니지가사키가 아닌 본인 이름으로 솔로 무대도 함. 久保田未夢는 i☆Ris 멤버이기도 하지만, 보고서는 繚乱！ビクトリーロード의 i☆Ris를 다른 멤버 네 명으로 적음. 앙코르 참여는 '全出演者'에서 미루어 판단함. Lemino 아카이브 스트리밍 3/14-3/22(별도 공연 아님). 근거: https://prtimes.jp/main/html/rd/p/000000956.000113690.html (주최사 アニマックスブロードキャスト・ジャパン의 공식 행사 리포트 보도자료. 아래 전재본으로 읽음). https://animeanime.jp/release/prtimes/20260313/275419.html (주최 측 리포트 전재: 2026年3月7日（土）Asue アリーナ大阪, 主催 NTTドコモ/アニマックスブロードキャスト・ジャパン, 虹ヶ咲가 Colorful Dreams! Colorful Smiles!와 約束になれ僕らの를 부름). https://zaikei.co.jp/releases/3344573/ (같은 주최 측 리포트의 다른 전재본)"
