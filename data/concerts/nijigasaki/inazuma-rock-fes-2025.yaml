    note: 'ja: 주최·공식 표기. rom·ko: 번역함. 일정 조사 메모: [2025-09-21 DAY2 (雷神ステージ)] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 前田佳織里(桜坂しずく), 久保田未夢(朝香果林), 村上奈津実(宮下愛). 세트리스트가 엇갈림. 주최 리포트는 6곡을 적고(虹色Passions！와 未来ハーモニー를 더하고 Just Believe!!!를 세 번째에 둠) Fandom은 4곡만 적음. 주최 쪽을 씀. 곡 순서는 리포트가 서술한 순서이며 웹 페이지 자동 요약으로 읽어서 순서가 중요하면 다시 확인해야 함. 리포트는 繚乱！ビクトリーロード의 게스트를 西川貴教로 적음(Fandom: T.M.Revolution). 근거: https://inazumarock.com/2025/ (주최 사이트: イナズマロック フェス 2025, 2025年9月20日(土)・21日(日), 会場 滋賀県草津市 烏丸半島芝生広場, 아티스트 목록에 虹ヶ咲学園スクールアイドル同好会 포함, lovelive-anime.jp/n… 링크). https://inazumarock.com/2025/cms/blog/384/ (주최 라이브 리포트 2025.09.21 雷神ステージ: 5명 大西亜玖璃（上原歩夢役）, 相良茉優（中須かすみ役）, 前田佳織里（桜坂しずく役）, 久保田未夢（朝香果林役）, 村上奈津実（宮下愛役）, 곡 虹色Passions！…). LL-Fans https://ll-fans.jp/data/event/263 도 주최와 같음'
