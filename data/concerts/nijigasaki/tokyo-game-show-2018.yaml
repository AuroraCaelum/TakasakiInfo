    note: "ja: 주최·공식 표기. rom·ko: 번역함. 일정 조사 메모: 토크 무대(외부 행사). [2018-09-22 Day1, 2018-09-23 Day2] 大西亜玖璃(上原歩夢), 相良茉優(中須かすみ), 前田佳織里(桜坂しずく), 久保田未夢(朝香果林), 村上奈津実(宮下愛), 鬼頭明里(近江彼方), 楠木ともり(優木せつ菜), 指出毬亜(エマ・ヴェルデ), 田中ちえ美(天王寺璃奈). 한 행사에서 부스 무대를 두 번 함. 회차별 출연은 9/22 大西・相良・前田・久保田, 9/23 村上・鬼頭・楠木・指出・田中. 관객 참여형 게임 플레이 무대(スクフェス 스코어 매치)와 토크이며 송출도 함. 가창은 보고되지 않음. 제목은 KLab 보도자료 표기를 따름(PR TIMES는 'デイ・ワン', スクスタ 사이트는 'Day1'). ja.wikipedia는 이 TGS에 9/20도 적지만 그것은 별개인 'ラブライブ！シリーズ発表会'(doubtful 참고). 근거: https://lovelive-as.bushimo.jp/news/tgs2018_kstage_43yh/ (スクスタ 공식 뉴스 2018.09.12 'TOKYO GAME SHOW 2018 ステージ情報のお知らせ': KLabGamesブース (4-C13) 特設ステージ, 「みんなで目指せ♪全員プレゼント！TGS2018 ラブライブ！スクフェス１００人スコアマッ…). https://prtimes.jp/main/html/rd/p/000000209.000006348.html (출전·무대 운영사 KLab 보도자료 2018-09-12: 같은 Day1 프로그램과 출연진, 9/20-21 KLab 부스 일정에는 니지가사키 무대 없음…)"
