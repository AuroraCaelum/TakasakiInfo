    source: https://www.choujigen-ongakusai.jp/2023/outline.html
    checked: 2026-11-05
    note: "ja: 주최·공식 표기. rom·ko: 번역안. 일정 조사 메모: [2023-02-11 DAY1] R3BIRTH. 날짜가 엇갈림. Fandom은 R3BIRTH가 Day 2(2/12)에 출연했다고 하지만 주최 라인업은 R3BIRTH를 2.11 sat 아래에 둬 공식 날짜를 씀. 주최 타임테이블은 이미지뿐이라 기계로 읽지 못함. 세트리스트는 Fandom에만 있음. R3BIRTH 멤버 개인 이름은 주최도 Fandom도 적지 않음. Liella!는 같은 페스티벌 2/12에 출연함(이 행이 아님). [2023-02-12 DAY2] Liella!. 출연일은 라인업 페이지의 두 블록으로 추정함. 첫 블록이 DAY1 오프닝 액트 GuilDrops로 끝남. Fandom 날짜 2023-02-12와 같음. 근거: https://www.choujigen-ongakusai.jp/2023/outline.html (주최 개요, Wayback 20250805082730: 2023年2月11日（土）/12日（日） 開場15:00 開演16:00, 公演場所 ぴあアリーナMM 神奈川県横浜市西区みなとみらい3-2-2, 온라인 송출 티켓 D…). https://www.choujigen-ongakusai.jp/2023/lineup.html (주최 라인업, Wayback 20250805085850: R3BIRTH는 '2.11sat Artists（50音順）' 아래, Liella!는 2.12sun 아래). https://web.archive.org/web/20250805082730/https://www.choujigen-ongakusai.jp/2023/outline.html (주최 개요: 2023年2月11日(土)・12日(日) ぴあアリーナMM). https://web.archive.org/web/20250805085850/https://www.choujigen-ongakusai.jp/2023/lineup.html (주최 라인업: 2일째 블록에 Liella!가 있음. 블록은 藍井エイル[취소], 内田真礼, ウマ娘, ClariS, GRANRODEO, 三森すずこ, Morfonica, 山下大輝, Liella!이며 출연진 이름 없음…). LL-Fans https://ll-fans.jp/data/event/145 도 주최와 같음"
