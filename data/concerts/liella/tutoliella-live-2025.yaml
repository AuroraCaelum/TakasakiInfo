evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/yuigaoka/live/?page=2
    checked: 2026-10-20
    note: '공식 라틴 표기 없음(로고도 가나). ちゅーとりえらいぶ!!는 Fandom이 말장난을 되살린 표기(헵번식 로마자 규칙대로면 Chuutorieraibu!!, 萌娘百科는 TUTOLieLIVE!!). ko: 나무위키 문서명에 시리즈명을 붙임. 외부 근거: rom: https://love-live.fandom.com/wiki/Liella!_no_TUTOLiella!!_LIVE ko: https://namu.wiki/w/Liella!%EC%9D%98%20%ED%8A%9C%ED%86%A0%EB%A6%AC%EC%97%98%EB%9D%BC%EC%9D%B4%EB%B8%8C!!. 일정 조사 메모: 날짜(2025年7月5日（土）、7月6日（日）)와 회장(LaLa arena TOKYO-BAY)은 공식 Liella! 라이브 목록에서 가져옴. 그 상세 링크 https://tutoliella-live.jp/ 는 지금 2026년 판을 보여 줘서 2025년 공연 구성은 더는 공식 페이지에 없음. 7/5에 1회(18:30), 7/6에 2회(13:00, 18:30)는 anime.eiga.com 행사 페이지 171046-171048(https://anime.eiga.com/event/171047/)과 LiveFans 기준이며 Fandom의 탭 세 개와 맞음. 7/6 두 공연의 2025년 공식 명칭은 알 수 없어(2026년 판은 昼公演/夜公演) 기본 라벨 Noon/Evening을 씀. rom: 사람이 검수함(2026-10-20). ja·ko처럼 !!를 끝에 둠(Fandom 문서명은 TUTOLiella!! LIVE).'
