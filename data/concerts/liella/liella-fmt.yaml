  fandom: Liella! LIVE & FAN MEETING TOUR ~Welcome to Yuigaoka!!~
evidence:
  title:
    status: derived
    source: https://www.lovelive-anime.jp/yuigaoka/live/sp_fmt/
    checked: 2026-10-20
    note: "공식 영문 없음. ライブ＆ファンミーティングツアー는 Fandom 표기로 원어를 되살림. ko: 나무위키 문서명은 'LIVE&FAN MEETING Tour'(부제 없음)라 원어 부분을 rom과 같게 맞춤. 유닛 투어 문서처럼 음역하면 '라이브&팬미팅 투어'. 외부 근거: rom: https://love-live.fandom.com/wiki/Liella!_LIVE_&_FAN_MEETING_TOUR_~Welcome_to_Yuigaoka!!~ ko: https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%8A%88%ED%8D%BC%EC%8A%A4%ED%83%80!!%20Liella!%20LIVE%26FAN%20MEETING%20Tour. 일정 조사 메모: 하루 두 번 공연(공식 표기 1回目/2回目, 여기서는 Noon/Evening). 나고야 Day 1만 1회. 공식 시작 시각: 오사카 6/11 15:30・19:00, 6/12 15:00・18:30. 도쿄 6/18 15:00・19:00, 6/19 14:00・18:00. 나고야 6/25 15:30만, 6/26 12:00・15:30(나고야 'Evening' 공연은 15:30 시작). Fandom은 하루에 세트리스트 하나를 실어(갤러리에서는 오사카 'Day 1 (Noon)'/'Day 1 (Evening)'을 나눔) Day 탭을 그날 두 공연 모두에 연결함. LiveFans는 Shooting Voice!!(Fandom Day 2 첫 곡)를 6/12 두 공연과 6/26 두 공연 모두에 적어 이와 맞음. 공식 Blu-ray 페이지는 제목을 「ラブライブ！スーパースター!! Liella! LIVE & FAN Meeting Tour ～Welcome to Yuigaoka!!～」로 적음. ja 제목은 라이브 페이지를 따름. 2기생은 토크 순서에만 나옴."
