    note: "ja: 방송사·주최 표기. rom·ko: 번역함. 일정 조사 메모: 방송 출연. [2021-12-08 第2夜] 伊達さゆり(澁谷かのん), Liyuu(唐可可), 岬なこ(嵐千砂都), ペイトン尚未(平安名すみれ), 青山なぎさ(葉月恋). Liella! 페스 출연 조사 자료와 엇갈리던 것을 정리함. 공연은 2021-12-08(第2夜), 후지TV. Fandom의 2021-10-09 / NHK Broadcasting Center는 따로 넣은 シブヤノオト and more FES.2021의 것. 그 조사 자료의 '2021FNS歌謡祭' 행과 같은 출연이라 이쪽을 쓰고 그쪽은 뺌. 생방송이었는지 적혀 있지 않아 날짜는 방송일로 둠. 근거: https://www.lovelive-anime.jp/yuigaoka/news/?id=8622 (Liella! 공식 뉴스 2021-11-18, Wayback 20211117220343 보관본): 「FNS歌謡祭 第２夜」 フジテレビ系列 12月8日(水)18:30〜23:03. LL-Fans로 교차 확인함. https://ll-fans.jp/data/event/124: 12/8"
