    note: 'ja: 주최·공식 표기. rom·ko: 번역함. 일정 조사 메모: [2024-03-17 15:00] 伊達さゆり(澁谷かのん), Liyuu(唐可可), 岬なこ(嵐千砂都), ペイトン尚未(平安名すみれ), 青山なぎさ(葉月恋), 鈴原希実(桜小路きな子), 薮島朱音(米女メイ), 大熊和奏(若菜四季), 絵森彩(鬼塚夏美), 結那(ウィーン・マルガレーテ), 坂倉花(鬼塚冬毬). 관객을 무료로 들인 NHK 팬미팅이며 공식으로는 토크로 표기됨. Fandom이 한 곡(未来は風のように)을 더 적어 live_event와 talk_only의 경계선. 공식 뉴스로 회장이 Shibuya, Tokyo의 NHKホール임을 확인함. Liella!는 2023년에도 超体験NHKフェス 토크쇼를 했으나(2023-03-18, Anime Hack 기준) 입력 행에는 없음. 근거: https://www.lovelive-anime.jp/yuigaoka/topics/detail.php?p=01_3136 (Liella! 공식 뉴스 2024-02-12, Wayback 20240614205434 경유: 超体験NHKフェス(3/16-21)의 무대 「ラブライブ！スーパースター‼」Liella! みんな、あつまれーー！ファンミ―ティング！, 2…)'
