    note: "ja: 공식 페이지. rom: 공식 영문. 레이블 카탈로그 영문판의 앨범 제목 Tsubaki Takizakura Jogakuin High School School Idol Club Koyasai Album!에 쓰인 부 이름. Fandom은 Tsubaki Takizakura Girls' High School Idol Club. ko: 나무위키 작품 문서 음반 절의 제목 츠바키타키자쿠라 여학원 고등학교 스쿨 아이돌부 후야제 앨범!에 쓰인 부 이름. 학교명은 음역하고 여학원 고등학교·스쿨 아이돌부는 번역해 니지가사키 학원 스쿨 아이돌 동호회와 같은 방식으로 씀. 아티스트 종류는 2024년 출연진 전원이 부른 작중 부라 group. 외부 근거: https://catalog.bandainamcomusiclive.co.jp/release/71877/ https://namu.wiki/w/%EB%9F%AC%EB%B8%8C%20%EB%9D%BC%EC%9D%B4%EB%B8%8C!%20%EC%8A%A4%EC%BF%A8%20%EC%95%84%EC%9D%B4%EB%8F%8C%20%EB%AE%A4%EC%A7%80%EC%BB%AC https://love-live.fandom.com/wiki/Yume_wa_Doko_Kara"
