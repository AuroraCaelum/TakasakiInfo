name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # E1–E11 (DESIGN.md §8); errors fail the job
      - run: uv run takasaki validate -v
      # E8: committed v1 files must equal a fresh build
      - run: uv run takasaki check
      - run: uv run pytest -q
