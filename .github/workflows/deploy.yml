name: deploy

# DESIGN.md §10.4. main: build → validate → upload → promote → invalidate → smoke test (rollback on failure).
# Other branches (workflow_dispatch): upload to releases/<sha>/ only; nothing public changes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: "make the release live (only on main)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # GitHub OIDC → takasakiinfo-github-deploy role

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # skip until the infrastructure exists and the repository settings are in place (infra/README.md).
    # secrets can't be used in a job-level `if`, so the gate is a variable.
    if: vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    env:
      PROMOTE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.promote) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group deploy
      - run: uv run takasaki validate
      - run: uv run takasaki check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # a secret, so the role ARN (and the account id in it) is masked in the public logs
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - run: >-
          uv run takasaki deploy
          --bucket "${{ vars.S3_BUCKET }}"
          --distribution "${{ vars.DISTRIBUTION_ID }}"
          --base-url "${{ vars.BASE_URL }}"
          --sha "${{ github.sha }}"
          ${{ env.PROMOTE == 'true' && '--promote' || '' }}
      # tell TakasakiInfo-Graph to rebuild from the data just made live. secrets can't be used in
      # an `if`, so a missing token is checked in the script and the step does nothing.
      - if: env.PROMOTE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GRAPH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GRAPH_DISPATCH_TOKEN not set; skipping"; exit 0; fi
          gh api "repos/${{ github.repository_owner }}/TakasakiInfo-Graph/dispatches" -f event_type=takasaki-data-updated
