[project]
name = "takasaki-infra"
version = "0.1.0"
description = "TakasakiInfo infrastructure (AWS CDK): CloudFront + S3 + Lambda Function URL with OAC"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.200",
    "constructs>=10.4",
]

[dependency-groups]
dev = ["pytest>=8", "boto3>=1.35"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
